name: Device profiles Windows installer

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['device-profiles-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run device profile regressions
        run: dotnet run --project tests/ProfileRegression/ProfileRegression.csproj --configuration Release
      - name: Build Windows installer
        shell: powershell
        run: .\scripts\build-device-profiles.ps1
      - name: Test PNG, JPG, SVG and dithering exports
        shell: powershell
        run: .\tests\WindowsImageRegression\Run.ps1 -App .\artifacts\device-profiles\app\LaserGRBL.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LaserGRBL-Device-Profiles-Windows
          path: artifacts/device-profiles/installer/*
          if-no-files-found: error
